# docker compose up -d  → http://localhost:8790
#
# Published on 127.0.0.1 only: the runbook executes code without a token, so it
# must not be reachable from other machines.
services:
  atlas:
    image: jidoil/mini-npu-atlas:1.2.0
    ports:
      - "127.0.0.1:${ATLAS_PORT:-8790}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # docker compose run --rm cli                → the console program
  # docker compose run --rm cli python -m unittest discover -s tests
  cli:
    profiles: [tools]
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    command: python main.py
